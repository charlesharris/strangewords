name: Strangewords
options:
  bundleIdPrefix: com.strangerwords
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: "2M6QRD8T3A"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  Strangewords:
    type: application
    platform: iOS
    sources:
      - Strangewords
    info:
      path: Strangewords/Info.plist
      properties:
        CFBundleDisplayName: Stranger Words
        # Bundled type voices (Resources/Fonts). Fraunces is the display serif
        # (it optically sizes itself via its opsz axis); Inter is the body/chrome
        # sans. iOS auto-registers anything listed here at launch.
        UIAppFonts:
          - Fraunces.ttf
          - Fraunces-SemiBold.ttf
          - Fraunces-Italic.ttf
          - Inter.ttf
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Dev-only: allow plain HTTP to the local backend during bring-up.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.strangerwords.us
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # App Attest (DeviceCheck) entitlement. The environment is a per-config
        # build setting: the development App Attest service on dev builds, the
        # production service for TestFlight/App Store. The server validates the
        # attestation against App ID 2M6QRD8T3A.com.strangerwords.us.
        CODE_SIGN_ENTITLEMENTS: Strangewords/Strangewords.entitlements
      configs:
        Debug:
          APP_ATTEST_ENVIRONMENT: development
        Release:
          APP_ATTEST_ENVIRONMENT: production
# Scheme for launching from Xcode (⌘R), including on a physical device. These
# environment variables apply ONLY to Xcode's Run action — not to `run.sh`
# (which builds then installs via simctl) nor to archived/TestFlight builds — so
# a device run defaults to the on-device mock stranger with dev chips on, instead
# of trying to reach the not-yet-live production backend.
schemes:
  Strangewords:
    build:
      targets:
        Strangewords: all
    run:
      config: Debug
      environmentVariables:
        SW_LOCAL_MOCK: "1"
        SW_DEV: "1"
