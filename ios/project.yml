name: Strangewords
options:
  bundleIdPrefix: app.strangewords
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: "2M6QRD8T3A"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  Strangewords:
    type: application
    platform: iOS
    # PrivacyInfo.xcprivacy comes in through this sources entry: XcodeGen files it
    # under the app's Resources phase, so it ships at the bundle root where App
    # Store Connect looks for it. No explicit buildPhase entry is needed (adding
    # one would list it twice). It declares the one required-reason API the app
    # uses (UserDefaults, reason CA92.1, via TokenStore) and that nothing is
    # tracked or collected. Any new required-reason API use, or a move to App
    # Group defaults (reason 1C8F.1), must be added to the manifest.
    sources:
      - Strangewords
    info:
      path: Strangewords/Info.plist
      properties:
        CFBundleDisplayName: Stranger Words
        # The app's only encryption is the OS-provided HTTPS via URLSession, which
        # is exempt from export documentation. Declaring it here skips App Store
        # Connect's per-build encryption questionnaire. Revisit if the app ever
        # adds its own cryptography beyond authentication (e.g. end-to-end
        # encrypting poem lines); App Attest is authentication and stays exempt.
        ITSAppUsesNonExemptEncryption: false
        # Bundled type voices (Resources/Fonts). Fraunces is the display serif
        # (it optically sizes itself via its opsz axis); Inter is the body/chrome
        # sans. iOS auto-registers anything listed here at launch.
        UIAppFonts:
          - Fraunces.ttf
          - Fraunces-SemiBold.ttf
          - Fraunces-Italic.ttf
          - Inter.ttf
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Dev-only: allow plain HTTP to the local backend during bring-up.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.strangewords
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # App Attest (DeviceCheck) entitlement. The environment is a per-config
        # build setting: the development App Attest service on dev builds, the
        # production service for TestFlight/App Store. The server validates the
        # attestation against App ID 2M6QRD8T3A.app.strangewords.
        CODE_SIGN_ENTITLEMENTS: Strangewords/Strangewords.entitlements
      configs:
        Debug:
          APP_ATTEST_ENVIRONMENT: development
        Release:
          APP_ATTEST_ENVIRONMENT: production
  # Hosted unit tests (Swift Testing). The test bundle is injected into the app
  # process, so `@testable import Strangewords` works. The app keeps
  # app.strangewords; only the test bundle gets the .tests suffix.
  StrangewordsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - StrangewordsTests
    dependencies:
      - target: Strangewords
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.strangewords.tests
# Scheme for launching from Xcode (⌘R), including on a physical device. These
# environment variables apply ONLY to Xcode's Run action — not to `run.sh`
# (which builds then installs via simctl) nor to archived/TestFlight builds — so
# a device run defaults to the on-device mock stranger with dev chips on, instead
# of trying to reach the not-yet-live production backend.
schemes:
  Strangewords:
    build:
      targets:
        Strangewords: all
    # The test action sets its own environment on purpose. Without it XcodeGen
    # emits shouldUseLaunchSchemeArgsEnv = YES and the tests silently inherit the
    # Run action's env (SW_DEV=1), so host isolation would hold only by accident.
    # SW_LOCAL_MOCK=1 makes AppModel.init pick LocalBackend and clear any token;
    # SW_API_BASE points at a dead local port so an accidental APIClient use fails
    # fast instead of reaching the production API.
    test:
      config: Debug
      targets:
        - StrangewordsTests
      environmentVariables:
        - variable: SW_LOCAL_MOCK
          value: "1"
        - variable: SW_API_BASE
          value: "http://127.0.0.1:9"
    run:
      config: Debug
      environmentVariables:
        SW_LOCAL_MOCK: "1"
        SW_DEV: "1"
