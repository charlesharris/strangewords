<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Stranger Words Privacy Policy</title>
<style>
  :root {
    --bg: #faf7f2;
    --text: #2a2622;
    --muted: #6b645c;
    --link: #7a3b1e;
    --rule: #e2dbd0;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16140f;
      --text: #ece6da;
      --muted: #a39b8e;
      --link: #e3a77f;
      --rule: #34302a;
    }
  }
  html {
    background: var(--bg);
    color: var(--text);
    font-size: 106.25%;
  }
  body {
    max-width: 38rem;
    margin: 0 auto;
    padding: 2rem 1.25rem 4rem;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.6;
  }
  h1, h2 {
    font-family: Georgia, "Times New Roman", serif;
    font-weight: 600;
    line-height: 1.25;
  }
  h1 { font-size: 2rem; margin: 0 0 0.5rem; }
  h2 {
    font-size: 1.35rem;
    margin: 2.25rem 0 0.5rem;
    padding-top: 1.25rem;
    border-top: 1px solid var(--rule);
  }
  p, li { overflow-wrap: break-word; }
  ul { padding-left: 1.25rem; }
  li { margin: 0.35rem 0; }
  .meta { color: var(--muted); margin: 0 0 1.5rem; }
  a { color: var(--link); text-decoration: underline; }
</style>
</head>
<body>
<header>
<h1>Stranger Words Privacy Policy</h1>
<p class="meta">Effective <time datetime="2026-10-26">October 26, 2026</time></p>
</header>
<main>
<p>Stranger Words lets you write a three-line poem with a stranger and then lets it go. It is built to know as little about you as possible.</p>

<h2>Contact</h2>
<p>Questions about privacy are welcome at <a href="mailto:privacy@strangewords.app">privacy@strangewords.app</a>.</p>
</main>
</body>
</html>
